# vam CI — the gates that can actually run here.
#
# Four jobs drive a real Chromium (or a real packaged Electron). `web-guards`
# runs the four asserting `e2e/*.mjs` scripts that need nothing but the web
# bundle — the only automatic checks on what jsdom cannot see (split/pane
# ordering, per-project layout restore, focus at the moment of an event,
# `position: sticky` against real layout). `playwright-e2e` runs the
# Playwright TEST-RUNNER suites that only need a browser and vam's own dev/
# preview server: `test:e2e` (`branch-overlap`, `error-log-select`,
# `pane-resize`, `stream-cookie` — real hit-testing, a real pointer drag, a
# real cookie over a real response, none of which jsdom or happy-dom can
# decide) and `test:e2e:phone` (`phone-shell.pw.ts`, 32 tests at 390px — the
# phone shell's touch targets and sheet geometry, laid out by a real engine).
# `playwright-electron` runs `test:e2e:electron` against an actual
# electron-builder `--dir` package — AC-18, the one check that `app.isPackaged`
# is really true and the renderer loads from the packaged `out/`, not
# `ELECTRON_RENDERER_URL`. None of the three ran automatically before this;
# by hand, on whichever machine last remembered to, is close enough to never.
#
# WHAT IS STILL DELIBERATELY ABSENT, and why, so nobody reads a green tick as
# more than it is: neither SSE e2e spec exercises a real factory here.
# `e2e/sse-drop.spec.ts` (AC-G1, one of the ten `playwright-e2e` tests) and
# `e2e/sse-drop-reconnect.pw.ts` (AC-10, its own script, `test:e2e:reconnect`
# — NOT wired into any job below) each need a live factory backend: they
# spawn it via SMITH_CLI_ENTRY, which points into a SIBLING REPOSITORY that
# is private and not checked out here. That blocker is not fixable by adding
# a step to this file. `sse-drop.spec.ts` itself is left inside `test:e2e`
# rather than filtered out — it `test.skip()`s itself the moment
# SMITH_CLI_ENTRY is unset (see its own header), which this workflow never
# sets, so it reports SKIPPED, never PASSED; a skip cannot be mistaken for
# coverage the way a silently-absent script could. `test:e2e:reconnect` gets
# no job at all, for the opposite reason: it is the ONLY script in its own
# config (`playwright.reconnect.config.ts`'s `testMatch` names the one file),
# so running it would produce nothing but that same skip, on its own runner
# minute, telling a reader nothing `test:e2e`'s own skip line does not
# already say. Both remain hand-run per `e2e/README.md`, and a green run of
# every job below still says nothing about SSE recovery. Nor do the five
# screenshot-only scripts (focus-edge-visibility, issue-188-shots,
# pane-refinements-shots, phone-list-shots, phone-prompt-shots) run anywhere:
# they assert NOTHING, and wiring shot-takers into CI would buy a slower job
# and no guard.
#
# `e2e/` is also excluded from vitest.config.ts, tsconfig*.json and biome.json,
# so no job below typechecks or lints those files either.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` is load-bearing, not hygiene. `test/keyboard/chords.ts`
      # reads the PRE-CHANGE chords table straight out of history --
      # `git show <BASE_SHA>:src/keyboard/chords.ts` -- because AC-5(a) demands
      # the "before" state come from the file that really shipped rather than a
      # hand-copied list that could drift. Under the default shallow clone that
      # commit's tree is never fetched, so the read fails with "path ... does
      # not exist in <sha>" -- which reads as a MISSING FILE and is actually a
      # missing history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # package.json engines: node >=22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each step runs even if an earlier one failed: one push should report
      # every broken gate, not just the first. A single red step still fails
      # the job.
      - name: lint
        run: pnpm run lint

      - name: typecheck (src)
        if: '!cancelled()'
        run: pnpm run typecheck

      # The root tsconfig loads the DOM lib for the WHOLE tree, so it typechecks
      # the main process as though it were a browser. That is the exact
      # confusion tsconfig.node.json/tsconfig.web.json exist to prevent, and
      # this repo has already shipped a bug of that class -- `MessageEvent<T>`
      # is generic in the DOM lib and not in Node's. Measured: a DOM-only type
      # in src/main leaves `pnpm run typecheck` green and fails typecheck:node.
      # Without these two steps CI is strictly weaker than the local gate.
      - name: typecheck (main + preload, no DOM)
        if: '!cancelled()'
        run: pnpm run typecheck:node

      - name: typecheck (renderer)
        if: '!cancelled()'
        run: pnpm run typecheck:web

      - name: typecheck (tests)
        if: '!cancelled()'
        run: pnpm run typecheck:test

      # BEFORE the unit suite, not after. `test/main/remote/phone-shell.test.ts`
      # asserts that the directory the phone's shell is served from holds
      # nothing but build output, and it refuses to pass quietly when there is
      # no build to read -- in CI it requires one. `pnpm run build` below emits
      # `dist/`; only `build:web` emits `dist-web`, and nothing in this job ran
      # it, so that guard had failed on every run since it landed. It stayed
      # green on a developer's machine for an unrelated reason: `pnpm dist`
      # leaves a `dist-web` behind.
      - name: build the browser bundle, so the served-root guard reads a real one
        if: '!cancelled()'
        run: pnpm run build:web

      - name: unit tests
        if: '!cancelled()'
        run: pnpm test

      - name: build
        if: '!cancelled()'
        run: pnpm run build

      # AC-13's proof that the application actually BOOTS. This epic's opening
      # S1 was that no criterion observed the app launching; the launch harness
      # answers it, and until now answered it only on a developer's machine, so
      # a non-booting build could reach main with a green tick. The harness
      # spawns a real Electron binary and needs a display, hence xvfb; it lives
      # in its own vitest config because an `exclude` in the default config
      # also suppresses an explicit run, which reports "no tests" while looking
      # like a pass.
      # Chromium's SUID sandbox helper must be root-owned and mode 4755, and
      # pnpm installs it unprivileged, so Electron aborts with "The SUID
      # sandbox helper binary was found, but is not configured correctly".
      #
      # The cheap fix is `--no-sandbox`, and it is the WRONG one here: AC-14
      # asserts `sandbox: true`, so disabling it would leave CI validating a
      # different security posture than the one that ships -- a check passing
      # for a reason unrelated to what it claims, which is the failure this
      # whole epic exists to stop. Fix the permissions and keep the sandbox on.
      - name: fetch Electron's binary, then give its SUID sandbox the ownership it requires
        if: '!cancelled()'
        run: |
          set -euo pipefail
          # electron's postinstall does not run under this install, so `dist/`
          # -- and the sandbox helper inside it -- does not exist until the
          # first launch downloads it lazily. That is AFTER any chmod here,
          # which is why fixing the permissions alone failed. Download it at a
          # known point instead, then fix the bit.
          node node_modules/electron/install.js
          sandbox=$(find node_modules -path '*/electron/dist/chrome-sandbox' -print -quit)
          test -n "$sandbox"
          # Chromium requires root ownership and mode 4755. The cheap fix is
          # `--no-sandbox`, and it is the WRONG one: AC-14 asserts
          # `sandbox: true`, so disabling it would leave CI validating a
          # security posture that is not the one shipping -- a check passing
          # for a reason unrelated to what it claims, which is the failure this
          # epic exists to stop.
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"

      - name: launch harness (Electron, needs a display)
        if: '!cancelled()'
        run: xvfb-run --auto-servernum pnpm run test:app

  # The four asserting `e2e/*.mjs` scripts, against a real browser. Separate
  # job, so a unit-suite failure and a real-browser failure are told apart at
  # a glance and neither waits on the other.
  web-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # package.json engines: node >=22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The scripts `import { chromium } from 'playwright-core'`, and
      # playwright-core is in NO manifest in this repo — locally it resolves
      # only because a shared node_modules happens to hold it. It cannot be
      # added to package.json either: the install above is
      # `--frozen-lockfile`, and pnpm-lock.yaml cannot be regenerated on the
      # machine this was written on (one shared node_modules serves every
      # worktree; an install there prunes electron out from under all of them).
      #
      # So the driver is installed HERE, into the runner's temp dir, off the
      # root lockfile entirely, and linked in where Node's ESM resolution will
      # find it when it walks up from `e2e/*.mjs`. `e2e/node_modules` is
      # gitignored, so this leaves no repo diff.
      #
      # Pinned to 1.62.1 — the version `e2e/node_modules` actually resolves to
      # today, so CI drives the same browser build a developer does. The
      # `playwright-core` package has NO install script (checked): it ships no
      # browser, hence the explicit `install chromium` after it.
      - name: playwright 1.62.1, outside the root lockfile
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" playwright-core@1.62.1
          mkdir -p e2e/node_modules
          ln -sfn "$RUNNER_TEMP/pw/node_modules/playwright-core" e2e/node_modules/playwright-core
          node "$RUNNER_TEMP/pw/node_modules/playwright-core/cli.js" install --with-deps chromium

      # Builds dist-web, serves it with `vite preview --strictPort`, runs the
      # four scripts sequentially against it and exits non-zero on the first
      # assertion that throws — each script's own message reaches this log
      # unedited. Screenshots go to the runner's temp dir, never docs/ui: CI
      # must not produce a repo diff.
      # `terminal-echo-scroll-shots.mjs` reads a REAL tmux pane on a private
      # socket through the app's own read path -- a stub read is what let a
      # broken scroll fix ship (#439). Without tmux the guard SKIPS, loudly,
      # and exits 0; this step is what makes it assert here. The same
      # install is also what turns `terminal-typing-latency-shots.mjs` (the
      # poll-path keystroke chain) and `terminal-stream-latency-shots.mjs`
      # (the shipped `StreamClient`, run last in the list on purpose --
      # see its own entry in `run-web-guards.mjs`) from a loud, exit-0 SKIP
      # into a real, asserting run: both open their own private tmux socket
      # the same way.
      - name: tmux, for the terminal guard
        run: sudo apt-get install -y tmux

      # VAM_E2E_CHECK_ORPHANS: safe here (and only here) because this step
      # always runs the full 50-guard list, never a subset — see
      # run-web-guards.mjs's own header for what the check does and why a
      # partial run would give it a false positive.
      - name: web guards (real Chromium)
        env:
          VAM_E2E_OUT: ${{ runner.temp }}/web-guard-shots
          VAM_E2E_CHECK_ORPHANS: '1'
          # TEMPORARY, diagnostic-only (removed once the pause-after CI-only
          # flake -- run 36236036684, job 108387840295 -- is root-caused):
          # forces the same starvation shape that run hit, on demand.
          VAM_E2E_FORCE_CONTENTION: '20'
        run: pnpm run test:e2e:web

      # A failed assertion is much easier to read next to the frame it failed on.
      - name: upload the shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-guard-shots
          path: ${{ runner.temp }}/web-guard-shots
          if-no-files-found: warn

  # The Playwright TEST-RUNNER suites — `test:e2e` (branch-overlap,
  # error-log-select, pane-resize, sse-drop [skips itself, see this file's own
  # header], stream-cookie) and `test:e2e:phone` (phone-shell.pw.ts, 32 tests
  # at 390px) — against a real headless Chromium. Separate job from
  # `web-guards`, on that job's own reasoning: a real-browser failure here
  # should never be confused with a unit-suite or web-guard one, and none of
  # the three should wait on either of the others.
  playwright-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # package.json engines: node >=22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `web-guards`' own step installs only `playwright-core` — enough for
      # `run-web-guards.mjs`'s bare `import { chromium } from 'playwright-core'`.
      # `test:e2e`/`test:e2e:phone` instead run
      # `e2e/node_modules/.bin/playwright test --config=...`, the actual
      # `@playwright/test` TEST RUNNER, whose config files and specs
      # `import ... from '@playwright/test'` — so this installs
      # `@playwright/test` itself (npm resolves that to `playwright` and
      # `playwright-core` underneath, the same 1.62.1 `e2e/node_modules`
      # already resolves to locally) and symlinks its `.bin` in too, not just
      # the one package `web-guards` needed.
      - name: playwright 1.62.1 (test runner), outside the root lockfile
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" @playwright/test@1.62.1
          mkdir -p e2e/node_modules
          for pkg in .bin @playwright playwright playwright-core; do
            ln -sfn "$RUNNER_TEMP/pw/node_modules/$pkg" "e2e/node_modules/$pkg"
          done
          node "$RUNNER_TEMP/pw/node_modules/playwright-core/cli.js" install --with-deps chromium

      # `playwright.config.ts`'s own `webServer` block builds and serves
      # `dist-web` via `vite --port 5273`; `playwright.phone.config.ts` does
      # the same on its own port with `vite preview`. `sse-drop.spec.ts`
      # skips itself (`SMITH_CLI_ENTRY` unset — see this file's own header);
      # the other four `test:e2e` specs and all 32 `test:e2e:phone` tests run
      # for real.
      - name: test:e2e (desktop, real Chromium)
        run: pnpm run test:e2e

      # `!cancelled()`, not the default: a desktop-suite failure above must
      # not hide whether the phone suite also passes — the same discipline
      # the `check` job's own steps use.
      - name: test:e2e:phone (390px, real Chromium)
        if: '!cancelled()'
        run: pnpm run test:e2e:phone

      # Both suites' traces land under `e2e/test-results/` (both configs'
      # own `outputDir`) — one artifact for the job, since only one of the
      # two ever needs inspecting on a given red run. `ignore`, not `warn`
      # (unlike `web-guards`' shots, which are written on every run whether
      # or not anything failed): `trace: 'retain-on-failure'` writes nothing
      # at all on an all-green run, so a missing directory there is the
      # expected case, not a warning.
      - name: upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-traces
          path: e2e/test-results
          if-no-files-found: ignore

  # `test:e2e:electron` (AC-18) — one Playwright test against the ACTUAL
  # electron-builder `--dir` package, not `electron-vite dev` and not the
  # `check` job's own launch harness (`test/electron/launch.test.ts`, AC-13/
  # AC-14): that one spawns the raw `electron` binary straight at `out/`, so
  # `app.isPackaged` there is always false. This is the one check that a REAL
  # package boots with `app.isPackaged: true`, loading from the packaged
  # `out/renderer/index.html` rather than `ELECTRON_RENDERER_URL` — the one
  # regression AC-18 exists to catch and the `check` job's own harness cannot.
  #
  # Separate job from `playwright-e2e`: packaging is a materially heavier,
  # differently-shaped build (electron-vite build, the web bundle, the
  # bundle-externals audit, then a real electron-builder package) than a
  # headless-Chromium suite needs, and a packaging break should read as a
  # packaging break rather than get buried in a browser job's log.
  playwright-electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # package.json engines: node >=22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same install as `playwright-e2e` — `e2e/electron-launch.et.ts` also
      # imports `_electron` from `@playwright/test`. See that job's own
      # comment for why this installs the whole package, not just
      # `playwright-core`. No `install --with-deps chromium` here: `_electron`
      # launches the PACKAGED app's own Electron binary (below), never a
      # Playwright-managed browser.
      - name: playwright 1.62.1 (test runner), outside the root lockfile
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" @playwright/test@1.62.1
          mkdir -p e2e/node_modules
          for pkg in .bin @playwright playwright playwright-core; do
            ln -sfn "$RUNNER_TEMP/pw/node_modules/$pkg" "e2e/node_modules/$pkg"
          done

      # The same three steps `pnpm dist` runs before packaging (package.json's
      # own `dist` script), minus the electron-builder call itself, which runs
      # next with `--dir` instead of `dist`'s full installer targets:
      # `electron-vite build` (main, preload, renderer -> `out/`), the web
      # bundle (`dist-web/`, which `electron-builder.config.cjs`'s own
      # `files` list ships inside the package for phone pairing), and the
      # bundle-externals audit that config's own comment says protects
      # `out/main/index.cjs`'s requires.
      - name: build the three packaging inputs
        run: |
          pnpm run build:app
          pnpm run build:web
          node scripts/check-bundle-externals.mjs

      # `--dir`, not the full `dist` target: an unpacked app is enough to
      # launch and inspect, and skips the slower installer/AppImage target
      # `pnpm dist` builds for a release. `dist-app/linux-unpacked/` is where
      # `electron-launch.et.ts`'s own `resolveExecutablePath()` looks on this
      # platform.
      #
      # `--config.electronDownload.isVerifyChecksum=false`, CI-only — this
      # flag never touches `electron-builder.config.cjs` itself, so a real
      # release (`pnpm dist`, run by a person) still verifies the checksum.
      # It exists because of what actually failed here on the first two
      # Linux runs (GitHub Actions run 34856620778, reproduced identically
      # on a `--failed` rerun): "downloaded label=electron progress=100%"
      # immediately followed by "Response code 504 (Gateway Time-out)". That
      # is NOT the electron.zip download itself succeeding then somehow
      # re-failing — reading the installed source
      # (`node_modules/@electron/get/dist/cjs/index.js`'s `validateArtifact`,
      # called from `app-builder-lib/out/util/electronGet.js`'s
      # `downloadArtifactToFile`) shows that after every electron zip
      # download, `@electron/get` fetches a SECOND, separate artifact —
      # `SHASUMS256.txt`, from the same GitHub release — to verify the zip's
      # checksum, UNLESS `isVerifyChecksum` is `false`. That file is under
      # 1MB, so electron-builder's own progress logging skips it entirely
      # (`electronGet.js`: "That file is tiny (<1 MB) and fires at 100%
      # immediately... skip progress display"), which is exactly why the log
      # shows nothing between the electron zip's own 100% line and the 504:
      # the failing request is silent by design. It is also UNCACHEABLE —
      # `@electron/get`'s own comment on that call reads "Never use the
      # cache for loading checksums, load them fresh every time"
      # (`cacheMode: ElectronDownloadCacheMode.Bypass` is hardcoded, not a
      # caller-configurable option) — so caching electron-builder's own
      # artifact directory between runs would not have prevented this
      # specific failure; it would still 504 on a cache MISS, and the
      # electron zip download this flag leaves untouched already benefits
      # from that same cache when warm. Skipping the checksum affects only
      # THIS job's own throwaway, never-distributed `--dir` build, not the
      # `sandbox: true` posture AC-14 checks two steps down — that is a
      # property of the packaged app's own `BrowserWindow` options, set in
      # `src/main`, and has nothing to do with how its Electron binary was
      # verified at build time.
      - name: package (electron-builder --dir)
        run: node_modules/.bin/electron-builder --dir --config electron-builder.config.cjs --config.electronDownload.isVerifyChecksum=false

      # UNVERIFIED ON A REAL LINUX RUNNER: written and reasoned from the
      # `check` job's own working recipe (same repo, same runner image),
      # adjusted from `node_modules/electron/dist/chrome-sandbox` to the
      # PACKAGED app's own copy — electron-builder's `--dir` step above
      # downloads and bundles its OWN Electron binary into `dist-app/`, a
      # separate copy from `node_modules/electron`'s, so the `check` job's
      # own chown never reaches this one. This task's own environment is
      # macOS, which has no SUID sandbox concept at all, so this exact step
      # could not be exercised here — confirm on the first real run that it
      # actually finds and fixes the right file, the way `check`'s own
      # comment records having measured its.
      - name: give the packaged app's SUID sandbox the ownership it requires
        run: |
          set -euo pipefail
          sandbox=$(find dist-app -name chrome-sandbox -print -quit)
          test -n "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"

      - name: test:e2e:electron (packaged app, needs a display)
        run: xvfb-run --auto-servernum pnpm run test:e2e:electron

      - name: upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-electron-traces
          path: e2e/test-results/electron
          if-no-files-found: ignore
