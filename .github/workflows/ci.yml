# vam CI — the gates that can actually run here.
#
# The `web-guards` job below DOES drive a real Chromium: the four asserting
# scripts under `e2e/` need nothing but the web bundle, and they carry the only
# automatic checks on what jsdom cannot see (split/pane ordering, per-project
# layout restore, focus at the moment of an event, `position: sticky` against
# real layout). They ran by hand until now, which is to say they mostly did not
# run.
#
# WHAT IS STILL DELIBERATELY ABSENT, and why, so nobody reads a green tick as
# more than it is: neither SSE e2e spec runs here. `e2e/sse-drop.spec.ts`
# (AC-G1) and `e2e/sse-drop-reconnect.pw.ts` (AC-10) each need a live factory
# backend — they spawn it via SMITH_CLI_ENTRY, which points into a SIBLING
# REPOSITORY that is private and not checked out here. That blocker is not
# fixable by adding a step to this file, so those two remain hand-run per
# e2e/README.md and a green run of THIS workflow still says nothing about SSE
# recovery. Nor do the five screenshot-only scripts
# (focus-edge-visibility, issue-188-shots, pane-refinements-shots,
# phone-list-shots, phone-prompt-shots) run anywhere: they assert NOTHING, and
# wiring shot-takers into CI would buy a slower job and no guard.
#
# `e2e/` is also excluded from vitest.config.ts, tsconfig*.json and biome.json,
# so the jobs below do not typecheck or lint those files either.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` is load-bearing, not hygiene. `test/keyboard/chords.ts`
      # reads the PRE-CHANGE chords table straight out of history --
      # `git show <BASE_SHA>:src/keyboard/chords.ts` -- because AC-5(a) demands
      # the "before" state come from the file that really shipped rather than a
      # hand-copied list that could drift. Under the default shallow clone that
      # commit's tree is never fetched, so the read fails with "path ... does
      # not exist in <sha>" -- which reads as a MISSING FILE and is actually a
      # missing history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # package.json engines: node >=22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each step runs even if an earlier one failed: one push should report
      # every broken gate, not just the first. A single red step still fails
      # the job.
      - name: lint
        run: pnpm run lint

      - name: typecheck (src)
        if: '!cancelled()'
        run: pnpm run typecheck

      # The root tsconfig loads the DOM lib for the WHOLE tree, so it typechecks
      # the main process as though it were a browser. That is the exact
      # confusion tsconfig.node.json/tsconfig.web.json exist to prevent, and
      # this repo has already shipped a bug of that class -- `MessageEvent<T>`
      # is generic in the DOM lib and not in Node's. Measured: a DOM-only type
      # in src/main leaves `pnpm run typecheck` green and fails typecheck:node.
      # Without these two steps CI is strictly weaker than the local gate.
      - name: typecheck (main + preload, no DOM)
        if: '!cancelled()'
        run: pnpm run typecheck:node

      - name: typecheck (renderer)
        if: '!cancelled()'
        run: pnpm run typecheck:web

      - name: typecheck (tests)
        if: '!cancelled()'
        run: pnpm run typecheck:test

      - name: unit tests
        if: '!cancelled()'
        run: pnpm test

      - name: build
        if: '!cancelled()'
        run: pnpm run build

      # AC-13's proof that the application actually BOOTS. This epic's opening
      # S1 was that no criterion observed the app launching; the launch harness
      # answers it, and until now answered it only on a developer's machine, so
      # a non-booting build could reach main with a green tick. The harness
      # spawns a real Electron binary and needs a display, hence xvfb; it lives
      # in its own vitest config because an `exclude` in the default config
      # also suppresses an explicit run, which reports "no tests" while looking
      # like a pass.
      # Chromium's SUID sandbox helper must be root-owned and mode 4755, and
      # pnpm installs it unprivileged, so Electron aborts with "The SUID
      # sandbox helper binary was found, but is not configured correctly".
      #
      # The cheap fix is `--no-sandbox`, and it is the WRONG one here: AC-14
      # asserts `sandbox: true`, so disabling it would leave CI validating a
      # different security posture than the one that ships -- a check passing
      # for a reason unrelated to what it claims, which is the failure this
      # whole epic exists to stop. Fix the permissions and keep the sandbox on.
      - name: fetch Electron's binary, then give its SUID sandbox the ownership it requires
        if: '!cancelled()'
        run: |
          set -euo pipefail
          # electron's postinstall does not run under this install, so `dist/`
          # -- and the sandbox helper inside it -- does not exist until the
          # first launch downloads it lazily. That is AFTER any chmod here,
          # which is why fixing the permissions alone failed. Download it at a
          # known point instead, then fix the bit.
          node node_modules/electron/install.js
          sandbox=$(find node_modules -path '*/electron/dist/chrome-sandbox' -print -quit)
          test -n "$sandbox"
          # Chromium requires root ownership and mode 4755. The cheap fix is
          # `--no-sandbox`, and it is the WRONG one: AC-14 asserts
          # `sandbox: true`, so disabling it would leave CI validating a
          # security posture that is not the one shipping -- a check passing
          # for a reason unrelated to what it claims, which is the failure this
          # epic exists to stop.
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"

      - name: launch harness (Electron, needs a display)
        if: '!cancelled()'
        run: xvfb-run --auto-servernum pnpm run test:app

  # The four asserting e2e scripts, against a real browser. Separate job, so a
  # unit-suite failure and a real-browser failure are told apart at a glance and
  # neither waits on the other.
  web-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # package.json engines: node >=22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The scripts `import { chromium } from 'playwright-core'`, and
      # playwright-core is in NO manifest in this repo — locally it resolves
      # only because a shared node_modules happens to hold it. It cannot be
      # added to package.json either: the install above is
      # `--frozen-lockfile`, and pnpm-lock.yaml cannot be regenerated on the
      # machine this was written on (one shared node_modules serves every
      # worktree; an install there prunes electron out from under all of them).
      #
      # So the driver is installed HERE, into the runner's temp dir, off the
      # root lockfile entirely, and linked in where Node's ESM resolution will
      # find it when it walks up from `e2e/*.mjs`. `e2e/node_modules` is
      # gitignored, so this leaves no repo diff.
      #
      # Pinned to 1.62.1 — the version `e2e/node_modules` actually resolves to
      # today, so CI drives the same browser build a developer does. The
      # `playwright-core` package has NO install script (checked): it ships no
      # browser, hence the explicit `install chromium` after it.
      - name: playwright 1.62.1, outside the root lockfile
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" playwright-core@1.62.1
          mkdir -p e2e/node_modules
          ln -sfn "$RUNNER_TEMP/pw/node_modules/playwright-core" e2e/node_modules/playwright-core
          node "$RUNNER_TEMP/pw/node_modules/playwright-core/cli.js" install --with-deps chromium

      # Builds dist-web, serves it with `vite preview --strictPort`, runs the
      # four scripts sequentially against it and exits non-zero on the first
      # assertion that throws — each script's own message reaches this log
      # unedited. Screenshots go to the runner's temp dir, never docs/ui: CI
      # must not produce a repo diff.
      - name: web guards (real Chromium)
        env:
          VAM_E2E_OUT: ${{ runner.temp }}/web-guard-shots
        run: pnpm run test:e2e:web

      # A failed assertion is much easier to read next to the frame it failed on.
      - name: upload the shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-guard-shots
          path: ${{ runner.temp }}/web-guard-shots
          if-no-files-found: warn
