<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!--
    vam app icon — a miniature canvas: three session nodes in a loose
    triangle, two quiet and one lit amber. The amber node is vam's own
    `waiting` colour, used here to mean exactly what it means in the
    product: this is the one that needs you. At 16px the quiet nodes and
    edges nearly vanish and the icon should read as an amber dot on
    near-black — that is deliberate, not a loss of detail.
  -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <!-- background tile: vam's canvas colour, corner radius ~22% of the side -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="#0a0a0a" />

  <!-- edges, drawn behind the nodes -->
  <g stroke="#1f1f1f" stroke-width="6" stroke-linecap="round">
    <line x1="84" y1="104" x2="76" y2="190" />
    <line x1="84" y1="104" x2="176" y2="150" />
    <line x1="76" y1="190" x2="176" y2="150" />
  </g>

  <!-- two quiet nodes -->
  <circle cx="84" cy="104" r="22" fill="#262626" stroke="#4a4a4a" stroke-width="4" />
  <circle cx="76" cy="190" r="20" fill="#262626" stroke="#4a4a4a" stroke-width="4" />

  <!-- the node that needs you: lit amber, noticeably larger, glow + ring -->
  <circle cx="176" cy="150" r="58" fill="#f59e0b" opacity="0.28" filter="url(#glow)" />
  <circle cx="176" cy="150" r="48" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.45" />
  <circle cx="176" cy="150" r="38" fill="#f59e0b" />
</svg>
